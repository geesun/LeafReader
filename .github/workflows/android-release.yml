name: Android Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp android/app/build/outputs/apk/debug/app-debug.apk leafreader-${VERSION}-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LeafReader ${{ github.ref_name }}"
          body: |
            ## LeafReader ${{ github.ref_name }}

            ### 安装说明
            1. 下载 `leafreader-${{ github.ref_name }}-debug.apk`
            2. 在 Android 设备上开启「允许安装未知来源应用」
            3. 安装 APK

            > 此版本使用 debug 签名，仅供测试使用。
          files: leafreader-${{ github.ref_name }}-debug.apk
          draft: false
          prerelease: false
