name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v0.0.0-dev'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk leafreader-${VERSION}-debug.apk
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "LeafReader ${{ env.VERSION }}"
          body: |
            ## LeafReader ${{ env.VERSION }}

            ### 安装说明
            1. 下载 `leafreader-${{ env.VERSION }}-debug.apk`
            2. 在 Android 设备上开启「允许安装未知来源应用」
            3. 安装 APK

            > 此版本使用 debug 签名，仅供测试使用。
          files: leafreader-${{ env.VERSION }}-debug.apk
          draft: false
          prerelease: false
